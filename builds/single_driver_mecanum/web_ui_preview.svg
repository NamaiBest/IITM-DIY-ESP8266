<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ESP Bot Single Motor Driver Mecanum by Namai - Web UI Preview</title>
  <desc id="desc">Preview mockup of the Single Motor Driver Mecanum browser control page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="100%" stop-color="#e3ecf8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0a9487"/>
    </linearGradient>
    <linearGradient id="stop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="310" y="70" width="580" height="620" rx="24" fill="#ffffff" stroke="#dbe7f2" stroke-width="2"/>

  <text x="600" y="125" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="34" fill="#172234">ESP Bot Single Motor Driver Mecanum</text>
  <a href="https://www.youtube.com/@-MRFUN">
    <text x="600" y="157" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="20" fill="#0b5fd7" text-decoration="underline">by Namai</text>
  </a>
  <text x="600" y="186" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#0b7285">Single driver mode supports normal drive controls.</text>

  <rect x="560" y="218" width="80" height="56" rx="12" fill="url(#btn)"/>
  <text x="600" y="254" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">Forward</text>

  <rect x="430" y="286" width="120" height="56" rx="12" fill="url(#btn)"/>
  <text x="490" y="322" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">Left</text>

  <rect x="560" y="286" width="80" height="56" rx="12" fill="url(#stop)"/>
  <text x="600" y="322" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">Stop</text>

  <rect x="650" y="286" width="120" height="56" rx="12" fill="url(#btn)"/>
  <text x="710" y="322" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">Right</text>

  <rect x="560" y="354" width="80" height="56" rx="12" fill="url(#btn)"/>
  <text x="600" y="390" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">Backward</text>

  <rect x="390" y="430" width="420" height="180" rx="16" fill="#f9fbfe" stroke="#dbe7f2"/>
  <text x="430" y="470" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="24" fill="#172234" font-weight="700">Speed</text>
  <rect x="730" y="446" width="48" height="28" rx="14" fill="#1d4ed8"/>
  <text x="754" y="467" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#ffffff" font-weight="700">5</text>
  <line x1="430" y1="520" x2="770" y2="520" stroke="#6a7d96" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="520" r="14" fill="#0f766e"/>
  <rect x="430" y="548" width="340" height="40" rx="10" fill="#eef3fa"/>
  <text x="600" y="574" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="18" fill="#607188">Ready</text>

  <text x="600" y="650" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Verdana" font-size="16" fill="#607188">Preview of the generated control page shown in browser</text>
</svg>
